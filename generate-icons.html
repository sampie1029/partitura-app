<!DOCTYPE html>
<html>
<head>
    <title>Generar Iconos</title>
</head>
<body>
    <h1>Generando iconos...</h1>
    <canvas id="c192" width="192" height="192"></canvas>
    <canvas id="c512" width="512" height="512"></canvas>
    <script>
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');

            // Fondo
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, size, size);

            // Círculo central
            ctx.fillStyle = '#e94560';
            ctx.beginPath();
            ctx.arc(size/2, size/2, size/3, 0, Math.PI * 2);
            ctx.fill();

            // Nota musical
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${size/3}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('♪', size/2, size/2);
        }

        drawIcon(document.getElementById('c192'), 192);
        drawIcon(document.getElementById('c512'), 512);

        // Descargar
        document.querySelectorAll('canvas').forEach(canvas => {
            const link = document.createElement('a');
            link.download = `icon-${canvas.width}.png`;
            link.href = canvas.toDataURL();
            link.textContent = `Descargar ${canvas.width}x${canvas.width}`;
            document.body.appendChild(link);
            document.body.appendChild(document.createElement('br'));
        });
    </script>
</body>
</html>
